# Anechoic noise suppressor filter-chain preset for PipeWire.
#
# PipeWire >= 1.6.3 only scans a canned list of plugin directories, which
# includes the libdir `ladspa` directory. The plugin path below is relative so
# the preset works regardless of where it is loaded from.
#
# Install with:
#   ./pipewire/install-preset.sh
# then restart the pipewire session
#   systemctl --user restart pipewire pipewire-pulse

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Anechoic Noise Suppression"
            media.name       = "Anechoic Noise Suppression"

            # Smart mode: capture on the input, process, expose the result as
            # a virtual source that tools like OBS / browsers can pick.
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = anechoic_suppressor
                        plugin = ladspa/libanechoic_ladspa
                        label  = noise_suppressor_mono

                        control = {
                            "VAD Threshold (%)"       = 55
                            "VAD Grace Period (ms)"   = 200
                            "VAD Hysteresis (%)"      = 0
                            "Comfort Noise Floor (dB)" = -40
                        }
                    }
                ]
            }

            # Nodes are usually created per-device, so name both capture and
            # playback with the device name slot.
            capture.props = {
                node.name   = "capture.anechoic_suppressor"
                node.passive = true
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name   = "playback.anechoic_suppressor"
                node.passive = true
                media.class = "Audio/Source"
            }
            audio.rate = 48000
            audio.position = [ FL ]
            capture.rate  = 48000
        }
    }
]